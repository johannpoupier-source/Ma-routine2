name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Televerser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
