<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ma Routine</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1 id="viewTitle">Aujourd'hui</h1>
        <p id="viewSubtitle" class="subtitle"></p>
      </div>
      <button id="addBtn" class="add-btn" aria-label="Nouvelle habitude" title="Nouvelle habitude">+</button>
    </header>

    <main id="main"></main>

    <nav class="tabbar">
      <button class="tab active" data-view="today">
        <span class="tab-icon">✅</span>
        <span class="tab-label">Aujourd'hui</span>
      </button>
      <button class="tab" data-view="habits">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">Habitudes</span>
      </button>
      <button class="tab" data-view="week">
        <span class="tab-icon">🗓️</span>
        <span class="tab-label">Semaine</span>
      </button>
      <button class="tab" data-view="stats">
        <span class="tab-icon">📊</span>
        <span class="tab-label">Stats</span>
      </button>
    </nav>
  </div>

  <dialog id="habitDialog" class="dialog">
    <form method="dialog" id="habitForm">
      <h2 id="dialogTitle">Nouvelle habitude</h2>

      <label class="field">
        <span>Nom de l'habitude</span>
        <input type="text" id="habitName" placeholder="Ex. Lire 20 minutes" required maxlength="60" autocomplete="off" />
      </label>

      <label class="field">
        <span>Emoji</span>
        <div id="emojiPicker" class="emoji-picker"></div>
      </label>

      <label class="field">
        <span>Couleur</span>
        <div id="colorPicker" class="color-picker"></div>
      </label>

      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="btn danger hidden">Supprimer</button>
        <button type="button" id="cancelBtn" class="btn">Annuler</button>
        <button type="submit" id="saveBtn" class="btn primary">Ajouter</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
